name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Dépendances
        run: pip install -r server/requirements.txt pytest
      - name: Tests backend (pytest)
        working-directory: server
        run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Vérification syntaxe frontend
        run: |
          for f in web/*.js web/*.mjs; do node --check "$f"; done
          cd web && node build-config.mjs
      - name: Configuration de déploiement (dry-run)
        run: python deploy/sync_env.py --dry-run
