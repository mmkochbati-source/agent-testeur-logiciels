name: Déploiement
on:
  push:
    branches: [main]
    paths: ["deploy/**", "server/**", "web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
concurrency:
  group: deploiement-production
  cancel-in-progress: false
jobs:
  sync-et-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx
      - name: Envoi de la configuration à Railway et Vercel
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          ABACUS_API_KEY: ${{ secrets.ABACUS_API_KEY }}
          PIPELINE_GITHUB_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
        run: python deploy/sync_env.py
      - name: Vérification post-déploiement
        env:
          EXPECTED_SHA: ${{ github.sha }}
          WAIT_SECONDS: "600"
        run: python deploy/verify.py
